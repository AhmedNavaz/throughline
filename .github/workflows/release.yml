name: Release

# Push a tag such as v0.4.0 (matching package.json) to build, test and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            label: apple-silicon
          - runner: macos-15-intel
            arch: x64
            label: intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Smoke test the packaged app
        run: |
          app="dist/Throughline-darwin-${{ matrix.arch }}/Throughline.app"
          codesign --verify --deep --strict "$app"
          AI_RELAY_DESKTOP_DATA="$RUNNER_TEMP/profile" AI_RELAY_LEGACY_DATA_DIR="$RUNNER_TEMP/none" "$app/Contents/MacOS/Throughline" --smoke-test | tee "$RUNNER_TEMP/smoke.log"
          grep -q AI_RELAY_DESKTOP_SMOKE "$RUNNER_TEMP/smoke.log"
      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Throughline-darwin-${{ matrix.arch }}/Throughline.app" "Throughline-${GITHUB_REF_NAME#v}-mac-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.label }}
          path: Throughline-*.zip
          if-no-files-found: error

  sharing-image:
    name: Private-link service image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test the image
        run: |
          docker build -f sharing/Dockerfile -t sharing-test .
          docker run -d --name sharing -p 4319:4319 sharing-test
          for attempt in $(seq 1 20); do
            if curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:4319/health; then exit 0; fi
            sleep 1
          done
          docker logs sharing
          exit 1
      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/throughline-sharing" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: sharing/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=Throughline private-link service for Ask a Friend
            index:org.opencontainers.image.licenses=MIT

  release:
    name: Publish the release
    needs: [desktop, sharing-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The repository already has an assets/ folder of icons, so downloads go elsewhere.
      - uses: actions/download-artifact@v8
        with:
          pattern: mac-*
          path: release-files
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd release-files && sha256sum Throughline-*.zip > SHA256SUMS.txt)
          awk -v version="$version" 'index($0, "## [" version "]") == 1 { found = 1; next } found && /^## \[/ { exit } found && !/^\[[^]]*\]: /' CHANGELOG.md > changes.md
          test -s changes.md
          {
            echo "## Install"
            echo
            echo "Run this in Terminal. It picks the right build for your Mac, verifies its checksum and installs it in Applications:"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo '```'
            echo
            echo "Or download the zip for your Mac:"
            echo
            echo "| Mac | File |"
            echo "| --- | --- |"
            echo "| Apple Silicon (M1 and later) | \`Throughline-$version-mac-apple-silicon.zip\` |"
            echo "| Intel | \`Throughline-$version-mac-intel.zip\` |"
            echo
            echo "Unzip, move **Throughline** to Applications and open it. Use your own configured Claude Code or Codex CLI connection, or connect Gemini through Google Antigravity in Settings (Install Google connection, then Connect account). Local continuation needs Codex CLI, Ollama and a downloaded tool-capable model. See the setup guide in the repository for authentication and billing details."
            echo
            echo "The app is not notarized by Apple yet, so the first time you open a browser download macOS says it cannot verify the developer. Open **System Settings › Privacy & Security** and click **Open Anyway**. You only need to do this once. If macOS instead says the app is damaged, run \`xattr -cr /Applications/Throughline.app\` and open it again."
            echo
            echo "The private-link service for Ask a Friend is published as a container image: \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/throughline-sharing:$version\`"
            echo
            echo "## What's new"
            cat changes.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" release-files/* --title "Throughline $version" --notes-file notes.md --verify-tag
