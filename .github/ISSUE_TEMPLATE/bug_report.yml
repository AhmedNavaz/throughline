name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please remove anything private, such as keys, file paths or code, from logs and screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace with two folders
        2. Switch from Claude to Codex
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: version
    attributes:
      label: Throughline version
      placeholder: "0.4.0"
  - type: input
    id: system
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, Apple Silicon"
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      multiple: true
      options:
        - Claude Code
        - Codex
        - Not agent-related
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
