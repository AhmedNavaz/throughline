<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Throughline</title>
  <!-- macOS app icon: an 824px tile on a 1024px canvas. One thread, teal (Codex) to coral (Claude), loops once and carries on. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a4a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="thread" x1="10" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fe0c5"/>
      <stop offset="0.5" stop-color="#9aa8ff"/>
      <stop offset="1" stop-color="#ff8c63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="185.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <g transform="translate(100 100) scale(8.24) translate(0 5)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 62C30 62 46 58 57 44C64 35 62 23 50 23C38 23 36 35 43 44" stroke="url(#thread)" stroke-width="8.5"/>
    <!-- A tile-colored gap where the thread crosses over itself. -->
    <path d="M43 44C54 58 70 62 88 62" pathLength="100" stroke="#151d35" stroke-width="17" stroke-dasharray="0 16 26 200"/>
    <path d="M43 44C54 58 70 62 88 62" stroke="url(#thread)" stroke-width="8.5"/>
  </g>
</svg>
